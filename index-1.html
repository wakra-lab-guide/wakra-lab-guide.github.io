id}}</style></head><body><header class="header"><div class="wrap"><div class="brand" id="brand"></div><div class="lang" role="group" aria-label="Language"><button data-lang="ar" aria-pressed="true">العربية</button><button data-lang="en" aria-pressed="false">English</button><button data-lang="ur" aria-pressed="false">اردو</button></div></div></header><section class="hero"><div class="wrap"><span class="eyebrow" id="eye"></span><h1 id="heading"></h1><p id="intro"></p><div class="searchbox"><input type="search" id="search" autocomplete="off"><button id="clear" aria-label="Clear search">×</button></div></div></section><main class="wrap main"><nav id="tabs" class="tabs" role="tablist"></nav><div class="toolbar"><h2 id="section-title"></h2><button id="print"></button></div><section id="content" class="panel" aria-live="polite"></section><div class="empty hidden" id="empty">لا توجد نتائج مطابقة / No results / کوئی نتیجہ نہیں</div><aside class="notice" id="notice"></aside></main><footer>Al Wakra Laboratory Guide · Independent draft · Not an official PHCC publication</footer><script>const DATA={"ar": {"fasting": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> معلومات عن تحاليل الصيام</h2>\n                    <p>هذه بعض الأمثلة للتحاليل التي تحتاج إلى صيام قبل إجرائها:</p>\n                    \n                    <div class=\"analysis-list\">\n                        <div class=\"analysis-item\">\n                            <h3> سكر الصيام</h3>\n                            <p>يحتاج إلى صيام لمدة 8-12 ساعة قبل سحب العينة.</p>\n                        </div>\n                        <div class=\"analysis-item\">\n                            <h3> الكوليسترول والدهون</h3>\n                            <p>يحتاج إلى صيام لمدة 9-12 ساعة للحصول على نتائج دقيقة.</p>\n                        </div>\n                        <div class=\"analysis-item\">\n                            <h3> فحص الحديد</h3>\n                            <p>يحتاج إلى صيام لمدة 8 ساعة قبل الفحص.</p>\n                        </div>\n                    </div>\n                    \n                    <div class=\"instructions\">\n                        <h3> تعليمات هامة</h3>\n                        <ul>\n                            <li>يسمح بشرب الماء فقط خلال فترة الصيام.</li>\n                            <li>يجب الامتناع عن التدخين خلال فترة الصيام.</li>\n                            <li>الالتزام بتعليمات الطبيب المعالج.</li>\n                            <li>إبلاغ الفني بأي أدوية تتناولها قبل سحب العينة.</li>\n                            <li>يفضل إجراء التحاليل في الصباح الباكر.</li>\n                        </ul>\n                    </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> تحليل سكر الصيام</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الوصف:</h3>\n                        <p>الدم، وهو المصدر الرئيسي للطاقة في الجسم، يقيس مستوى الجلوكوز (السكر) في الدم.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الغرض من الفحص:</h3>\n                        <ul class=\"detail-list\">\n                            <li>يستخدم لتشخيص مرض السكري</li>\n                            <li>مراقبة مستوى السكر لدى مرضى السكري</li>\n                            <li>تحديد انخفاض أو ارتفاع السكر في الدم</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> التحضير للفحص:</h3>\n                        <p>يتم جمع عينة الدم في الصباح بعد الصيام لمدة 8 ساعات على الأقل.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> مدة ظهور النتيجة:</h3>\n                        <p>تظهر نتيجة التحليل في اليوم التالي.</p>\n                    </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> تحليل الكوليسترول والدهون</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الوصف:</h3>\n                        <p>فحص لمستوى الدهون في الدم، يشمل الكوليسترول الكلي، الكوليسترول الجيد (HDL)، الكوليسترول الضار (LDL)، والدهون الثلاثية.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الغرض من الفحص:</h3>\n                        <ul class=\"detail-list\">\n                            <li>تقييم خطر الإصابة بأمراض القلب والأوعية الدموية</li>\n                            <li>مراقبة فعالية علاج خفض الدهون</li>\n                            <li>الكشف عن اضطرابات الدهون في الدم</li>\n                            <li>توجيه قرارات العلاج والوقاية</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> التحضير للفحص:</h3>\n                        <p>يجب الصيام لمدة 9-12 ساعة قبل سحب العينة، مع السماح بشرب الماء فقط.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> مدة ظهور النتيجة:</h3>\n                        <p>تظهر نتائج التحليل عادةً خلال 24-48 ساعة.</p>\n                    </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> فحص الحديد</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الوصف:</h3>\n                        <p>الحديد معدن يحتاجه الجسم للنمو والتطور.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> الغرض من الفحص:</h3>\n                        <p>يقيس هذا الفحص كمية الحديد في دمك ويمكنه الكشف عن حالاتٍ مثل فقر الدم، أو زيادة الحديد في الجسم.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> التحضير للفحص:</h3>\n                        <ul class=\"detail-list\">\n                            <li>يُفضّل الصيام طوال الليل (8 ساعات) وأخذ عينة الدم في الصباح الباكر، نظرًا لاختلاف ساعات النهار، مما يؤدي إلى انخفاض تركيزات الحديد في المصل ومؤشر كتلة الجسم الكلي في فترة ما بعد الظهر مقارنةً بالصباح.</li>\n                            <li>لا تتناول أقراص الحديد لمدة ٢٤ ساعة قبل الاختبار.</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> مدة الانتظار:</h3>\n                        <p>تظهر نتيجة التحليل عادة خلال يوم الى يومين.</p>\n                    </div>\n            ", "time": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> تحاليل يتم إجراؤها في وقت معين</h2>\n                    \n                    <div class=\"time-tests-list\">\n                        <div class=\"time-test-item\">\n                            <h3> PT & PTT - سيولة الدم</h3>\n                            <p>يتم استقبال عينات الدم لهذا الفحص (الفترة الصباحية من الساعة 8 الى 11 صباحا، والفترة المسائية من الساعة 7 الى 8 مساءا) وفقا لوقت السيارة التي ستنقل العينات الى مستشفى حمد لضرورة نقل هذا التحليل في مدة زمنية معينه حتى لا تتأثر النتائج.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Quantiferon TB Plus</h3>\n                            <p>يتم جمع العينة من الأحد إلى الأربعاء من الساعة 7:00 الى 11:00 صباحا.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Iron Profile - الحديد</h3>\n                            <p>يُفضّل أخذ عينة دم في الصباح الباكر، نظرًا لأن التباين اليومي يؤدي إلى انخفاض تركيزات الحديد في فترة ما بعد الظهر مقارنةً بالصباح.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> الكورتيزول</h3>\n                            <p>يفضل عمل التحليل اثناء الفترة الصباحية (8 صباحًا) والفترة المسائية (8 مساءً).</p>\n                        </div>\n                    </div>\n            ", "samples": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> طرق جمع العينات</h2>\n                    \n                    <div class=\"sample-methods-list\">\n                        <div class=\"sample-method-item\">\n                            <h3> كيفية تجميع عينة البول الروتينية</h3>\n                            <p><strong>للبالغين:</strong></p>\n                            <ol>\n                                <li>اغسل يديك بالماء والصابون.</li>\n                                <li>نظف المنطقة التناسلية.</li>\n                                <li>افتح عبوة التحليل واترك كمية صغيرة من البول تمر إلى المرحاض ومن ثم قم بوضع منتصف عينة البول في العبوة.</li>\n                                <li>اغلق العبوة بإحكام وضعها في الكيس البلاستيك الخاص وقم بتسليمه إلى المختبر.</li>\n                            </ol>\n                            \n                            <p><strong>للأطفال:</strong></p>\n                            <ol>\n                                <li>احصل على الكيس البلاستيك المخصص لجمع عينات الأطفال من التقني.</li>\n                                <li>على الوالدين غسل الأيدي بالماء والصابون ومن ثم تنظيف المنطقة التناسلية للطفل ومن ثم وضع الكيس البلاستيك على المنطقة مباشرة بعد تبول الطفل فانزع الكيس وانقل البول إلى العبوة المخصصة لجميع البول.</li>\n                                <li>اغلق العبوة بإحكام وضعها في الكيس البلاستيك الخاص وقم بتسليمه إلى المختبر.</li>\n                            </ol>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> كيفية تجميع عينات مزرعة البول</h3>\n                            <ul>\n                                <li>تأكد من استخدام العبوة المخصصة لفحص الزراعة والتي تحتوي على بودرة من حمض البوريك.</li>\n                                <li>يجب ملؤها إلى العلامة المحددة (20 مل) ومن ثم غلق العبوة وخلطها ثلاث مرات وتسليمها للمختبر.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> كيفية تجميع عينة البول لمدة 24 ساعة</h3>\n                            <ul>\n                                <li>الحصول على عبوة تجميع البول المناسبة والمخصصة للتحليل مع الكيس البلاستيك من المختبر.</li>\n                                <li>عند البدء بعملية التجميع، قم بإفراغ المثانة بشكل كامل في المرحاض، وقم بتسجيل الوقت بدءًا من ذلك الوقت.</li>\n                                <li>قم بتجميع البول داخل عبوة التجميع حتى نفس الوقت من اليوم التالي (وقت الانتهاء يجب أن يكون نفس وقت البدء في اليوم السابق).</li>\n                                <li>احفظ العبوة في الثلاجة خلال تجميع العينة.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> تعليمات لتجميع عينات البراز</h3>\n                            <ul>\n                                <li>احصل على العبوة المناسبة لفحص البراز وكذلك الكيس البلاستيك المخصص من المختبر.</li>\n                                <li>احرص على عدم مزج العينة بالبول أو ماء المرحاض أو دم الحيض (للنساء).</li>\n                                <li>يمكنك وضع مناديل ورقية كبيرة أو أي مادة مناسبة توضع فوق المرحاض بحيث لا يتلوث البراز بمياه المرحاض.</li>\n                                <li>باستخدام الملعقة الموجودة داخل عبوة التجميع، قم بأخذ عينات البراز من عدة مناطق وتأكد من وجود كمية صغيرة من البراز على الملعقة.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> فحص تحمل الجلوكوز في الدم (GTT)</h3>\n                            <ul>\n                                <li>يلزم الصيام الليلي من 8-10 ساعة.</li>\n                                <li>تناول نظام غذائي متوازن يحتوي على ما لا يقل عن 150 جرام من الكربوهيدرات يوميًا قبل الفحص بثلاثة أيام. يرجى استشارة الطبيب للحصول على المزيد من المعلومات.</li>\n                                <li>تجنب الأكل، الركوب، التدخين، المجهود البدني، والضغط النفسي حتى الانتهاء من إجراء التحليل.</li>\n                                <li>احرص على إبلاغ موظف المختبر عند التقيؤ خلال أي مرحلة من مراحل الاختبار.</li>\n                                <li>على المريض الحضور للمركز الصحي الساعة 8 صباحًا حيث سيمكث في المركز من 2 إلى 3 ساعة.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> فحص تحمل الجلوكوز للنساء الحوامل</h3>\n                            <ul>\n                                <li>سيتم جمع عينة الدم في حالة الصيام، ثم شرب محلول 75 جرام تليه أخذ عينات دم بعد الساعة الأولى والثانية من تناول محلول الجلوكوز.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> فحص تحمل الجلوكوز لغير الحوامل</h3>\n                            <ul>\n                                <li>سيتم جمع عينة الدم في حالة الصيام وبعد ساعتين من تناول 75 جرام من محلول الجلوكوز عن طريق الفم.</li>\n                            </ul>\n                        </div>\n                    </div>\n            ", "faq": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> بعض التساؤلات</h2>\n                    \n                    <div class=\"faq-list\">\n                        <div class=\"faq-item\">\n                            <h3> هل يمكنني شرب أي شيء غير الماء أثناء الصيام؟</h3>\n                            <p>لا، قد تنتقل العصائر والقهوة والمشروبات الغازية وغيرها من المشروبات إلى مجرى الدم وتؤثر على نتائجك. ولكن يمكنك شرب الماء العادي. تجنب المياه الغازية بنكهة الليمون أو المنكهة، فقد تحتوي على سكريات أو محليات صناعية. الحفاظ على رطوبة الجسم يُسهّل عملية الفحص. ذلك لأن الماء يُساعد على الاحتفاظ بالمزيد من السوائل في الأوردة، مما يُسهّل أخذ عينة من الدم.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> هل يمكنني الاستمرار في تناول الدواء أثناء الصيام؟</h3>\n                            <p>اسأل طبيبك عما إذا كان من المقبول تناول أدويتك المعتادة الموصوفة طبيًا، قد يُطلب منك التوقف عن تناول أدويتك. لكن لا تتوقف عن تناول أدويتك إلا إذا طلب منك طبيبك ذلك. أخبر طبيبك أيضًا بأي فيتامينات ومكملات غذائية تتناولها. بهذه الطريقة ستضمن تجنب أي شيء قد يؤثر على نتائج فحوصاتك.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> ماذا لو أخطأتُ في تناول الطعام أو الشراب غير الماء أثناء صيامي؟</h3>\n                            <p>أخبر طبيبك إذا تناولت الطعام أو الشراب قبل الفحص. قد تحتاج إلى تأجيل الفحص إلى وقتٍ آخر يسمح لك بالصيام لضمان الحصول على نتائج دقيقة.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> متى يمكنني تناول الطعام والشراب بشكل طبيعي؟</h3>\n                            <p>يمكنك تناول الطعام فور انتهاء الفحص.</p>\n                        </div>\n                    </div>\n            "}, "en": {"fasting": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> Information About Fasting Tests</h2>\n                    <p>Here are some examples of tests that require fasting before performing:</p>\n                    \n                    <div class=\"analysis-list\">\n                        <div class=\"analysis-item\">\n                            <h3> Fasting Blood Sugar</h3>\n                            <p>Requires fasting for 8-12 hours before sample collection.</p>\n                        </div>\n                        <div class=\"analysis-item\">\n                            <h3> Cholesterol and Lipids</h3>\n                            <p>Requires fasting for 9-12 hours for accurate results.</p>\n                        </div>\n                        <div class=\"analysis-item\">\n                            <h3> Iron Test</h3>\n                            <p>Requires fasting for 8 hours before the test.</p>\n                        </div>\n                    </div>\n                    \n                    <div class=\"instructions\">\n                        <h3> Important Instructions</h3>\n                        <ul>\n                            <li>Only water is allowed during the fasting period.</li>\n                            <li>Avoid smoking during the fasting period.</li>\n                            <li>Follow your doctor's instructions carefully.</li>\n                            <li>Inform the technician about any medications you're taking.</li>\n                            <li>It's preferable to perform tests early in the morning.</li>\n                        </ul>\n                    </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> Fasting Blood Sugar Test</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Description:</h3>\n                        <p>Blood test that measures the level of glucose (sugar) in the blood, which is the main source of energy for the body.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Purpose of the Test:</h3>\n                        <ul class=\"detail-list\">\n                            <li>Used to diagnose diabetes</li>\n                            <li>Monitor blood sugar levels in diabetic patients</li>\n                            <li>Identify low or high blood sugar levels</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Preparation for the Test:</h3>\n                        <p>Blood sample is collected in the morning after fasting for at least 8 hours.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Result Time:</h3>\n                        <p>Test results appear the next day.</p>\n                    </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> Cholesterol and Lipids Test</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Description:</h3>\n                        <p>A test that measures the level of fats in the blood, including total cholesterol, good cholesterol (HDL), bad cholesterol (LDL), and triglycerides.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Purpose of the Test:</h3>\n                        <ul class=\"detail-list\">\n                            <li>Assess the risk of cardiovascular diseases</li>\n                            <li>Monitor the effectiveness of lipid-lowering treatment</li>\n                            <li>Detect blood lipid disorders</li>\n                            <li>Guide treatment and prevention decisions</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Preparation for the Test:</h3>\n                        <p>Must fast for 9-12 hours before sample collection, with only water allowed.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Result Time:</h3>\n                        <p>Test results usually appear within 24-48 hours.</p>\n                    </div>\n            \n                \n                \n                <div class=\"analysis-detail-card\">\n                    <h2> Iron Test</h2>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Description:</h3>\n                        <p>Iron is a mineral that the body needs for growth and development.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Purpose of the Test:</h3>\n                        <p>This test measures the amount of iron in your blood and can detect conditions such as anemia or iron overload in the body.</p>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Preparation for the Test:</h3>\n                        <ul class=\"detail-list\">\n                            <li>It is preferable to fast overnight (8 hours) and take a blood sample early in the morning, due to the variation during the day, which leads to lower iron concentrations in serum and total body mass index in the afternoon compared to the morning.</li>\n                            <li>Do not take iron tablets for 24 hours before the test.</li>\n                        </ul>\n                    </div>\n                    \n                    <div class=\"detail-section\">\n                        <h3> Waiting Time:</h3>\n                        <p>Test results usually appear within one to two days.</p>\n                    </div>\n            ", "time": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> Time-Specific Tests</h2>\n                    \n                    <div class=\"time-tests-list\">\n                        <div class=\"time-test-item\">\n                            <h3> PT & PTT - Blood Coagulation</h3>\n                            <p>Blood samples for this test are received (morning period from 8 to 11 am, and evening period from 7 to 8 pm) according to the time of the vehicle that will transport the samples to Hamad Hospital due to the need to transfer this analysis within a specific time period so that the results are not affected.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Quantiferon TB Plus</h3>\n                            <p>The sample is collected from Sunday to Wednesday from 7:00 to 11:00 am.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Iron Profile</h3>\n                            <p>It is preferable to take a blood sample early in the morning, as the daily variation leads to lower iron concentrations in the afternoon compared to the morning.</p>\n                        </div>\n                        \n                        <div class=\"time-test-item\">\n                            <h3> Cortisol</h3>\n                            <p>It is preferable to perform the test during the morning period (8 am) and the evening period (8 pm).</p>\n                        </div>\n                    </div>\n            ", "samples": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> Sample Collection Methods</h2>\n                    \n                    <div class=\"sample-methods-list\">\n                        <div class=\"sample-method-item\">\n                            <h3> How to Collect Routine Urine Sample</h3>\n                            <p><strong>For Adults:</strong></p>\n                            <ol>\n                                <li>Wash your hands with water and soap.</li>\n                                <li>Clean the genital area.</li>\n                                <li>Open the test container and let a small amount of urine pass into the toilet, then place the midstream urine sample in the container.</li>\n                                <li>Close the container tightly and place it in the special plastic bag and deliver it to the laboratory.</li>\n                            </ol>\n                            \n                            <p><strong>For Children:</strong></p>\n                            <ol>\n                                <li>Get the plastic bag designated for collecting children's samples from the technician.</li>\n                                <li>Parents should wash their hands with water and soap, then clean the child's genital area, then place the plastic bag directly on the area after the child urinates, remove the bag and transfer the urine to the container designated for urine collection.</li>\n                                <li>Close the container tightly and place it in the special plastic bag and deliver it to the laboratory.</li>\n                            </ol>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> How to Collect Urine Culture Samples</h3>\n                            <ul>\n                                <li>Make sure to use the container designated for the culture test, which contains boric acid powder.</li>\n                                <li>It should be filled to the specified mark (20 ml), then close the container, mix it three times, and deliver it to the laboratory.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> How to Collect 24-Hour Urine Sample</h3>\n                            <ul>\n                                <li>Obtain the appropriate urine collection container designated for the analysis along with the plastic bag from the laboratory.</li>\n                                <li>When starting the collection process, empty your bladder completely into the toilet, and record the time starting from that time.</li>\n                                <li>Collect urine inside the collection container until the same time the next day (the end time should be the same as the start time from the previous day).</li>\n                                <li>Keep the container in the refrigerator during sample collection.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> Instructions for Collecting Stool Samples</h3>\n                            <ul>\n                                <li>Obtain the appropriate container for stool examination and the designated plastic bag from the laboratory.</li>\n                                <li>Be careful not to mix the sample with urine, toilet water, or menstrual blood (for women).</li>\n                                <li>You can place large paper towels or any suitable material placed over the toilet so that the stool is not contaminated with toilet water.</li>\n                                <li>Using the spoon inside the collection container, take stool samples from several areas and make sure there is a small amount of stool on the spoon.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> Glucose Tolerance Test (GTT)</h3>\n                            <ul>\n                                <li>Overnight fasting for 8-10 hours is required.</li>\n                                <li>Eat a balanced diet containing at least 150 grams of carbohydrates daily for three days before the test. Please consult your doctor for more information.</li>\n                                <li>Avoid eating, riding, smoking, physical exertion, and psychological stress until the test is completed.</li>\n                                <li>Be sure to inform the laboratory staff if vomiting occurs during any stage of the test.</li>\n                                <li>The patient should come to the health center at 8 am and will stay at the center for 2 to 3 hours.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> Glucose Tolerance Test for Pregnant Women</h3>\n                            <ul>\n                                <li>A blood sample will be collected in a fasting state, then drink a 75-gram solution followed by taking blood samples after the first and second hours of consuming the glucose solution.</li>\n                            </ul>\n                        </div>\n                        \n                        <div class=\"sample-method-item\">\n                            <h3> Glucose Tolerance Test for Non-Pregnant Women</h3>\n                            <ul>\n                                <li>A blood sample will be collected in a fasting state and two hours after consuming 75 grams of glucose solution orally.</li>\n                            </ul>\n                        </div>\n                    </div>\n            ", "faq": "\n                \n                \n                <div class=\"content-card\">\n                    <h2> Frequently Asked Questions</h2>\n                    \n                    <div class=\"faq-list\">\n                        <div class=\"faq-item\">\n                            <h3> Can I drink anything other than water while fasting?</h3>\n                            <p>No, juices, coffee, soft drinks, and other beverages may enter the bloodstream and affect your results. But you can drink plain water. Avoid lemon-flavored or flavored carbonated water, as it may contain sugars or artificial sweeteners. Keeping the body hydrated facilitates the examination process. This is because water helps retain more fluids in the veins, making it easier to take a blood sample.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> Can I continue taking medication while fasting?</h3>\n                            <p>Ask your doctor if it is acceptable to take your usual medically prescribed medications. You may be asked to stop taking your medications. But do not stop taking your medications unless your doctor asks you to. Also tell your doctor about any vitamins and dietary supplements you are taking. This way you will ensure avoiding anything that may affect your test results.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> What if I mistakenly eat or drink something other than water during my fast?</h3>\n                            <p>Tell your doctor if you ate or drank before the test. You may need to postpone the test to another time that allows you to fast to ensure accurate results.</p>\n                        </div>\n                        \n                        <div class=\"faq-item\">\n                            <h3> When can I eat and drink normally?</h3>\n                            <p>You can eat immediately after the test is completed.</p>\n                        </div>\n                    </div>\n            "}, "ur": {"fasting": "<div class=\"cards\"><article class=\"card\"><h3>روزے کے ساتھ کیے جانے والے ٹیسٹ</h3><p>خون میں شوگر (Fasting Blood Sugar): عام طور پر 8 سے 12 گھنٹے کا فاقہ درکار ہوتا ہے۔ پانی پی سکتے ہیں۔</p></article><article class=\"card\"><h3>کولیسٹرول اور لپڈ پروفائل</h3><p>اصل رہنما میں 9 سے 12 گھنٹے کا فاقہ درج ہے۔ تاہم ہر مریض کے لیے فاقہ ضروری نہیں؛ اپنے ڈاکٹر یا لیبارٹری کی ہدایت پر عمل کریں۔</p></article><article class=\"card\"><h3>آئرن ٹیسٹ</h3><p>اصل رہنما میں صبح نمونہ دینے اور تقریباً 8 گھنٹے فاقے کا ذکر ہے۔ آئرن کی گولیاں روکنے سے پہلے ڈاکٹر سے تصدیق کریں۔</p></article><article class=\"card\"><h3>اہم ہدایات</h3><p>فاقے کے دوران سادہ پانی پئیں۔ ادویات ڈاکٹر کے مشورے کے بغیر بند نہ کریں۔ لیبارٹری کو اپنی دواؤں اور سپلیمنٹس کے بارے میں بتائیں۔</p></article></div>", "time": "<div class=\"cards\"><article class=\"card\"><h3>PT اور PTT — خون جمنے کے ٹیسٹ</h3><p>ان نمونوں کے لیے مخصوص اوقات اور بروقت نقل و حمل ضروری ہو سکتی ہے۔ الوکرہ مرکز سے تازہ ترین اوقات کی تصدیق کریں۔</p></article><article class=\"card\"><h3>QuantiFERON-TB Plus</h3><p>نمونہ جمع کرنے کے دن اور اوقات محدود ہو سکتے ہیں۔ آنے سے پہلے لیبارٹری سے تصدیق کریں۔</p></article><article class=\"card\"><h3>Iron Profile</h3><p>عموماً صبح نمونہ دینا بہتر ہوتا ہے؛ ڈاکٹر کی ہدایت پر عمل کریں۔</p></article><article class=\"card\"><h3>Cortisol</h3><p>یہ ٹیسٹ مخصوص وقت پر لیا جا سکتا ہے، مثلاً صبح یا شام۔ نسخے پر درج وقت اور لیبارٹری کی ہدایت کی پابندی کریں۔</p></article></div>", "samples": "<div class=\"cards\"><article class=\"card\"><h3>عام پیشاب کا نمونہ</h3><p>ہاتھ دھوئیں، متعلقہ جگہ صاف کریں، پیشاب کی ابتدائی مقدار ٹوائلٹ میں خارج کریں اور درمیانی دھار صاف برتن میں جمع کریں۔ ڈھکن بند کرکے لیبارٹری میں جمع کرائیں۔ بچوں کے لیے لیبارٹری سے مناسب کلیکشن بیگ لیں۔</p></article><article class=\"card\"><h3>پیشاب کی کلچر (Urine Culture)</h3><p>لیبارٹری کا مخصوص برتن استعمال کریں۔ اگر برتن میں محافظ مادہ ہو تو اس کی نشان زدہ مقدار تک بھریں؛ مخصوص حجم کی تصدیق عملے سے کریں۔</p></article><article class=\"card\"><h3>24 گھنٹے کا پیشاب</h3><p>شروع میں مثانہ خالی کرکے وقت لکھیں۔ اس کے بعد اگلے 24 گھنٹوں کا تمام پیشاب جمع کریں، اور اختتامی وقت پر آخری نمونہ بھی شامل کریں۔ محفوظ رکھنے کی ہدایات لیبارٹری سے حاصل کریں۔</p></article><article class=\"card\"><h3>پاخانے کا نمونہ</h3><p>لیبارٹری کا مخصوص برتن استعمال کریں۔ نمونے کو پیشاب، ٹوائلٹ کے پانی یا ماہواری کے خون سے آلودہ نہ ہونے دیں۔ برتن مضبوطی سے بند کریں۔</p></article><article class=\"card\"><h3>Glucose Tolerance Test (GTT)</h3><p>اس ٹیسٹ کے لیے پہلے سے فاقہ، مقررہ خوراک اور مرکز میں دو سے تین گھنٹے قیام درکار ہو سکتا ہے۔ دورانِ ٹیسٹ کھانے، سگریٹ نوشی اور ورزش سے گریز کریں؛ قے ہونے پر عملے کو بتائیں۔</p></article><article class=\"card\"><h3>حمل میں GTT</h3><p>ڈاکٹر کے حکم کے مطابق فاقے کا نمونہ، گلوکوز محلول اور مقررہ وقفوں سے مزید خون کے نمونے لیے جا سکتے ہیں۔</p></article><article class=\"card\"><h3>غیر حاملہ افراد میں GTT</h3><p>ڈاکٹر کے حکم کے مطابق فاقے کا نمونہ اور گلوکوز پینے کے دو گھنٹے بعد نمونہ لیا جا سکتا ہے۔</p></article></div>", "faq": "<div class=\"cards\"><article class=\"card\"><h3>فاقے میں کیا پی سکتے ہیں؟</h3><p>عام طور پر سادہ پانی پیا جا سکتا ہے۔ جوس، چائے، کافی یا میٹھے مشروبات سے پرہیز کریں، جب تک ڈاکٹر دوسری ہدایت نہ دے۔</p></article><article class=\"card\"><h3>کیا دوائیں جاری رکھیں؟</h3><p>اپنی دوائیں خود سے بند نہ کریں۔ ڈاکٹر سے پوچھیں اور لیبارٹری کو ادویات اور سپلیمنٹس کے بارے میں بتائیں۔</p></article><article class=\"card\"><h3>غلطی سے کچھ کھا لیا تو؟</h3><p>لیبارٹری کو ضرور بتائیں۔ ممکن ہے ٹیسٹ کا وقت تبدیل کرنا پڑے۔</p></article><article class=\"card\"><h3>ٹیسٹ کے بعد کب کھا سکتے ہیں؟</h3><p>عام طور پر نمونہ لینے کے بعد کھا پی سکتے ہیں، بشرطیکہ مزید فاقے والے ٹیسٹ باقی نہ ہوں۔</p></article></div>"}};const COPY={"ar": {"brand": "مركز الوكرة الصحي", "sub": "دليل الفحوصات المخبرية", "eyebrow": "دليل المرضى · نسخة تجريبية", "title": "معلومات فحوصاتك في مكان واحد", "intro": "تعليمات التحضير للفحوصات وجمع العينات والأ
